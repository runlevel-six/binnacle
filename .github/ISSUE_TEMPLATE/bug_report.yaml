---
name: Bug report
description: A pane renders wrong, data is missing, or sextant fails to start
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Most bugs come down to a cluster shape we haven't seen. The environment
        questions below are the fastest path to a fix — please don't skip them.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: snapshot
    attributes:
      label: Output of `sextant --debug-snapshot -v`
      description: >-
        This prints one line per resource kind without starting the TUI, and is
        usually enough to identify which data source is unhappy. Redact
        hostnames and cluster names as needed.
      render: text
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: sextant version
      description: Output of `sextant --version`
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: profile
    attributes:
      label: Profile in use
      placeholder: metal3 (default) / atmosphere / custom
    validations:
      required: true

  - type: textarea
    id: cluster
    attributes:
      label: Cluster shape
      description: The more of this you can fill in, the better.
      value: |
        - Kubernetes version:
        - Cluster API version:
        - Metal3 / BMO version:
        - Namespace(s) holding CAPI objects:
        - Node-role label key(s) in use:
        - CNI:
        - Storage:
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: For rendering and layout issues, a screenshot plus your terminal size helps a lot.
    validations:
      required: false
