---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Container images, published to GHCR.
#
# Two moving tags and one immutable one: `edge` follows main, `vX.Y.Z` is cut
# from a tag, and `latest` follows the newest release. Tags stay the only thing
# that mints a version number, the same rule the binary releases follow.
name: Image

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and push
    # Forks get main pushes too, and cannot write to this package.
    if: github.repository == 'runlevel-six/binnacle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch,enable={{is_default_branch}},value=edge
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # linux/arm64 as well as amd64: the clusters are amd64, but a
          # developer on an arm laptop should be able to run the same image.
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
