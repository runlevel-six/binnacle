---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "${unformatted}" ]; then
            echo "::error::These files need gofmt:"
            echo "${unformatted}"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -coverprofile=coverage.txt ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.txt
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # v8 is the action generation that installs golangci-lint v2. v6 resolved
      # `latest` to v1.64.8, which refused to start:
      #
      #   can't load config: the Go language version (go1.24) used to build
      #   golangci-lint is lower than the targeted Go version (1.26.1)
      #
      # That check is the constraint to respect when changing either version here
      # or the Go version in go.mod: golangci-lint will not run against a target
      # newer than the toolchain its own binary was built with. The pinned release
      # below is built with go1.26.2, which covers go.mod's 1.26.1 — bumping go.mod
      # past that needs a linter bump in the same commit.
      #
      # Pinned rather than `latest` for the usual reason: a new release can add a
      # check and turn a green branch red with no change to the code.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  # Confirms the release pipeline stays valid without publishing anything.
  goreleaser-check:
    name: GoReleaser Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          # Pinned for the same reason as golangci-lint above: a GoReleaser
          # release can change what a config file is allowed to say, and a
          # release pipeline is the worst place to discover that.
          version: v2.17.1
          args: check

      - name: Dry-run build
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.17.1
          args: build --snapshot --clean --single-target
