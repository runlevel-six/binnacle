{{define "styles"}}
<style>
  :root {
    color-scheme: dark;
    /* Sampled from the artwork, so the mark sits on the page with no seam
       around it: --bg is literally the logo's own ground. */
    --bg: #000b1e; --panel: #0a1a2e; --line: #17324d;
    --ink: #f0e8d8; --dim: #8ba3bd;
    --brass: #b08040; --teal: #4fc3b5;

    /* Status colors are not brand colors. The logo's brass sits almost on
       top of a conventional amber, so warn is pushed toward orange and brass
       is kept to structure — rules and the wordmark — and never put on a card.
       A subsystem in trouble must not be mistakable for decoration. */
    --ok: #4fb37a; --warn: #e08a2e; --err: #e05a5a; --loading: #5d7186;
  }
  * { box-sizing: border-box; }
  /* Every size on the page is a rem, and the root is the only absolute one.
     That is what lets a wall display scale the whole thing by setting a single
     value: an absolute size on body would leave anything inheriting it — the
     card's own headline numbers among them — at 14px while the rest grew. */
  html { font-size: 14px; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 1rem/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: .85rem; flex-wrap: wrap;
    padding: .9rem 1.5rem;
    border-bottom: 1px solid var(--line);
    box-shadow: inset 0 -1px 0 0 color-mix(in srgb, var(--brass) 35%, transparent);
  }
  .mark { width: 2.43rem; height: 2.43rem; display: block; }
  /* A serif wordmark, echoing the logo's own lettering. */
  h1 {
    margin: 0; font-size: 1.15rem; letter-spacing: .16em; text-transform: uppercase;
    font-family: Georgia, "Times New Roman", serif; font-weight: 600; color: var(--ink);
  }
  .sub { color: var(--dim); font-size: .85rem; }
  /* The site is the one thing distinguishing two otherwise identical pages,
     so it reads as a peer of the product name rather than as metadata. */
  .site {
    font-size: .9rem; font-weight: 600; color: var(--teal);
    padding: .1rem .55rem; border: 1px solid color-mix(in srgb, var(--teal) 45%, transparent);
    border-radius: 4px; letter-spacing: .02em;
  }
  .live { margin-left: auto; color: var(--dim); font-size: .8rem; }
  .live::before {
    content: ""; display: inline-block; width: .5rem; height: .5rem;
    border-radius: 50%; background: var(--ok); margin-right: .4rem;
    vertical-align: baseline;
  }
  .live.stale::before { background: var(--warn); }
  main { padding: 1.5rem; }
  /* A page anyone can read says so on itself. Across the full width and above
     the content, because the footer is where a reader stops looking. */
  .unauth {
    margin: 0; padding: .5rem 1.5rem; font-size: .8rem; font-weight: 600;
    color: var(--bg); background: var(--warn);
  }
  /* Cards are wide enough for a pool table and grow to fill the row. A fleet
     is read on a wide screen, and two narrow cards stranded at the top left of
     it waste the only thing a browser has that a terminal does not. */
  .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(27rem, 1fr)); }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--loading); border-radius: 6px; padding: .9rem 1.05rem;
    /* The card is the query container for its own contents. A datacenter with
       two clusters gives each card twice the width four clusters would, on the
       same screen — so how much detail fits is a question about the card, not
       about the viewport, and only a container query can ask it. */
    container-type: inline-size;
  }
  .card.ok   { border-left-color: var(--ok); }
  .card.warn { border-left-color: var(--warn); }
  .card.err  { border-left-color: var(--err); }
  .card h2 { margin: 0; font-size: 1.02rem; font-weight: 600; }
  .ns { color: var(--dim); font-weight: 400; font-size: .8rem; }
  .meta { color: var(--dim); font-size: .8rem; margin: .15rem 0 .7rem; }
  .rolling { color: var(--warn); font-weight: 600; }
  /* Paused is amber, not red. It is nearly always somebody's deliberate act —
     a rollout held while a host is worked on — and red says a thing has gone
     wrong. It still has to stand out, because a paused cluster that looks
     ordinary is how a rollout stays paused for a week. */
  .frozen  { color: var(--warn); font-weight: 600; }
  .warnish { color: var(--warn); }

  /* Sized to its content, not to the card. Stretching it put a pool's ready
     count seven hundred pixels from the pool it belongs to, which reads as two
     unrelated columns rather than one row. */
  .pools { width: auto; max-width: 100%; border-collapse: collapse; font-size: .8rem; margin-bottom: .7rem; }
  .pools td { padding: .12rem .4rem .12rem 0; white-space: nowrap; }
  .pool-role { color: var(--dim); text-transform: uppercase; font-size: .68rem; letter-spacing: .05em; }
  /* A pool name long enough to overflow a narrow card wraps rather than being
     clipped: the tail of these names is the part that identifies them. */
  .pool-name { color: var(--ink); white-space: normal; word-break: break-word; }
  .pool-n, .pool-v { font-variant-numeric: tabular-nums; text-align: right; }
  .pool-v { color: var(--dim); }
  .pool-rolling .pool-n { color: var(--warn); }

  /* The workload cluster is unreadable while the management side answers
     happily. Stated in words, because the absence of six health cells is not
     something a reader can be expected to notice. */
  .halfblind {
    margin: 0 0 .7rem; padding: .35rem .55rem; font-size: .78rem;
    color: var(--warn); background: color-mix(in srgb, var(--warn) 9%, transparent);
    border-left: 2px solid var(--warn); border-radius: 0 3px 3px 0; word-break: break-word;
  }

  /* The top margin matters where .nums follows a table directly, as it does in
     the node pools pane: without it the labels sit against the last row and
     read as a fourth column of it. */
  .nums { display: flex; gap: 1.25rem; margin: .8rem 0 .7rem; flex-wrap: wrap; }
  .num .k { color: var(--dim); font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; }
  .num .v { font-variant-numeric: tabular-nums; }

  .workloads { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .7rem; }
  .wl { font-size: .75rem; color: var(--dim); font-variant-numeric: tabular-nums; }
  .wl.degraded { color: var(--warn); }

  .cells { display: flex; flex-wrap: wrap; gap: .35rem; }
  .cell {
    font-size: .75rem; padding: .1rem .45rem; border-radius: 3px;
    border: 1px solid var(--line); color: var(--dim); white-space: nowrap;
  }
  .cell.ok   { color: var(--ok); }
  .cell.warn { color: var(--warn); border-color: var(--warn); }
  .cell.err  { color: var(--err); border-color: var(--err); }
  .cell .d { opacity: .85; }

  /* Node readiness per role. Bounded by the number of roles, not the number of
     nodes, which is what lets it sit on a card for a seventy-node cluster. */
  .roles { display: flex; flex-wrap: wrap; gap: .1rem .9rem; margin-bottom: .7rem; }
  .role { font-size: .75rem; font-variant-numeric: tabular-nums; }
  .role-k { color: var(--dim); }
  .role.degraded, .role.degraded .role-k { color: var(--warn); }

  /* A problem on a card is a place to go, not just a number to read. Underlined
     on hover only: a card full of permanently underlined links reads as
     decoration and stops signaling anything. */
  .problem-link { color: inherit; text-decoration: none; }
  .problem-link:hover { text-decoration: underline; }

  /* The expanded tier. Hidden by default so the narrow case — four clusters on
     a 1080p screen, or a wall display — never pays for it, and revealed once
     the card is wide enough to hold it without crowding the core. */
  .expanded { display: none; }
  @container (min-width: 34rem) {
    .expanded { display: block; margin-top: .15rem; }
  }
  .ex-block { margin-bottom: .55rem; }
  .ex-k {
    color: var(--teal); font-size: .66rem; text-transform: uppercase;
    letter-spacing: .08em; font-weight: 700; margin-bottom: .15rem;
  }
  .podlist { list-style: none; margin: 0; padding: 0; }
  .podlist li { font-size: .75rem; }
  .more { font-size: .72rem; }
  .problem { color: var(--err); font-size: .82rem; word-break: break-word; }
  .empty { color: var(--dim); }
  .card .summary {
    margin: 0; font-size: .73rem; color: var(--ink);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
  }
  .seen { color: var(--dim); font-size: .75rem; margin-top: .6rem; }
  footer {
    padding: 1rem 1.5rem; color: var(--dim); font-size: .8rem;
    border-top: 1px solid var(--line);
    box-shadow: inset 0 1px 0 0 color-mix(in srgb, var(--brass) 30%, transparent);
  }

  /* Wall mode: a display read from across a room rather than from a desk.
     Every size on the page is a rem, so one root value scales all of it. */
  html.wall { font-size: 24px; }
  /* Televisions still overscan by a few percent. 1.5rem is barely 1% of a
     1080p width, which is not enough cushion for the header's right edge or the
     footer to survive it. */
  html.wall header, html.wall main, html.wall footer { padding-left: 3rem; padding-right: 3rem; }
  /* Core tier only. At wall scale four clusters land as a two-by-two, which
     leaves each card roughly seventeen lines: enough for the core, not enough
     for the core and the expanded block. A board read in a two-second glance
     from across the room wants less on it than a desk does, not more. */
  html.wall .expanded { display: none; }
  /* Nobody reads the corner of a wall display. A stale connection has to be the
     loudest thing on the page, because a frozen board that still looks healthy
     is worse than a blank screen. */
  html.wall .live.stale {
    background: var(--warn); color: var(--bg); font-weight: 700;
    padding: .15rem .6rem; border-radius: 4px; font-size: .9rem;
  }
  html.wall .live.stale::before { background: var(--bg); }
</style>
<style>
  /* Cluster detail. Panes are a masonry-ish grid rather than sextant's packed
     terminal layout: a browser can scroll, so a pane that wants to be tall is
     allowed to be, and nothing has to be truncated to fit a fixed row. */
  .detail-head {
    display: flex; gap: 1rem; align-items: flex-start; flex-wrap: wrap;
    padding: 0 0 .9rem; border-bottom: 1px solid var(--line); margin-bottom: 1rem;
  }
  .dh-left { flex: 1 1 22rem; }
  .detail-head h2 { margin: 0; font-size: 1.15rem; }
  /* Twelve explicit columns, with each pane declaring its own span.
     auto-fit cannot be used here: it only collapses tracks that no item
     occupies, and a full-width pane spanning 1/-1 occupies all of them. So the
     wide panes pinned the grid open at six tracks and the two narrow panes at
     the top each got one of them, leaving four tracks — most of the screen —
     empty beside a pool name wrapped onto two lines. */
  /* align-items: start, so a pane ends where its content does. Stretched to the
     row's tallest, a two-line subsystem summary beside a twenty-row pod table
     drew three hundred pixels of empty bordered box, which reads as something
     missing rather than as something short. */
  .panes { display: grid; gap: 1rem; grid-template-columns: repeat(12, 1fr); align-items: start; }

  /* Two real columns, each packing its own panes top to bottom.
     
     Three arrangements were tried. A grid makes rows, and a row is as tall as
     its tallest pane, so a short pane beside a tall one always leaves a hole:
     stretch fills it with empty bordered box, start leaves it as background,
     neither packs. Multi-column packs but *flows* — the browser chooses where
     the break falls, so a pane cannot be assigned to a column and the two
     columns end wherever the balancing leaves them.
     
     Two flex columns give both. Each packs tightly, and which pane goes where
     is a decision rather than an outcome. That is what matters here: the two
     panes whose height depends entirely on what is happening — unhealthy pods
     and events — go last in their column, where growing costs nothing and
     everything above them keeps its place no matter how the day is going.
     
     The only unavoidable space is below the shorter column, and putting the
     variable panes last is what keeps it small most of the time. */
  .columns { display: grid; gap: 1rem; grid-template-columns: 1fr; align-items: start; }
  @media (min-width: 78rem) {
    .columns { grid-template-columns: 1fr 1fr; }
  }
  .col { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
  .pane {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: .8rem 1rem 1rem; min-width: 0;
  }
  /* Full width is the default. A pane earns a narrower span by asking, which
     means a new pane is never accidentally squeezed. */
  .pane { grid-column: span 12; }
  .pane.wide { grid-column: span 12; }
  /* Two across once a half-pane has room to be useful. The only panes left in
     the grid are the ones that need width rather than packing, so .half now has
     a single user: two storage clusters sharing the fleet page's row. The
     thirds and quarters this once carried went with the panes they were for,
     which flow now — a column has one width, and a span there means nothing. */
  @media (min-width: 52rem) {
    .pane.half { grid-column: span 6; }
  }
  /* .paired went with the grid region it was for: network and cloud sit in a
     column now, and a column has one width. */
  /* A pane arrived at from a card's deep link should not sit flush against the
     top of the viewport with its heading half under the browser chrome. */
  .pane[id] { scroll-margin-top: 1rem; }
  .pane[id]:target { border-color: color-mix(in srgb, var(--teal) 55%, var(--line)); }
  .pane h3 {
    margin: 0 0 .6rem; font-size: .72rem; text-transform: uppercase;
    letter-spacing: .1em; color: var(--brass); font-weight: 700;
  }
  .pane h4 { margin: .6rem 0 .2rem; font-size: .78rem; color: var(--ink); }
  .count { color: var(--dim); font-weight: 400; letter-spacing: 0; text-transform: none; }
  .pane table { width: 100%; border-collapse: collapse; font-size: .78rem; }
  .pane table.spaced, .pane .spaced { margin-top: .9rem; }
  .pane th {
    text-align: left; font-weight: 600; font-size: .66rem; letter-spacing: .06em;
    color: var(--dim); text-transform: uppercase; padding: 0 .5rem .25rem 0;
    border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  .pane td { padding: .16rem .5rem .16rem 0; vertical-align: top; }
  /* Right-aligned cells keep their gutter unless they are last in the row.
     Without the exception for :last-child a right-aligned number butts
     straight into the next column and the two fuse: "3/3v1.36.2", "3/4Running",
     "388ovn-ovsdb-nb-0". The trailing column is the only one that can safely
     lose the padding, because nothing follows it. */
  .pane td.r, .pane th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .pane td.r:last-child, .pane th.r:last-child { padding-right: 0; }
  .dim { color: var(--dim); }
  .errish { color: var(--err); }
  .row-err td { background: color-mix(in srgb, var(--err) 7%, transparent); }
  .indent { padding-left: 1rem; font-size: .74rem; }
  /* Messages are the one genuinely unbounded column; let it take the slack and
     wrap rather than pushing the numeric columns off the pane. */
  .msg { width: 99%; word-break: break-word; }
  /* .fit sizes a table to its content and stops there.
     
     A growth column is right when the content is long and wrong when it is not,
     and the events table gets both. Given width: 99% the message column
     swallowed every spare pixel: with short messages that left a thousand
     pixels between the message and the count at the pane's edge, while the
     object column next to it was held at its 15rem floor and wrapped a pod name
     onto two lines. Sized to content instead, the object column takes what it
     needs, the count follows the message, and the slack lands at the pane's
     edge. A long message still fills the width and wraps, because the table can
     still grow to 100% — it just no longer starts there. */
  .pane table.fit { width: auto; max-width: 100%; }
  .pane table.fit .msg { width: auto; }
  /* A table of short columns must not be stretched across the pane at all.
     Auto layout spreads the slack evenly between the columns; handing one
     column 99% only moves the same slack inside it, and left-aligned text
     leaves the whole gap trailing — a node name against a role heading eighteen
     hundred pixels away. Both are the same mistake. What a reader wants is the
     columns beside each other, with the leftover space out at the edge of the
     pane where it does no harm. Only a table with an unbounded column of its
     own — events, and its message — should fill the width. */
  /* Each column takes the width its content needs, and the space left over is
     divided equally between them.
     
     Three arrangements were tried before this one. A table at width:100% gives
     the surplus to whichever column is widest already, in proportion — which is
     how a node name ended up eighteen hundred pixels from its role. Sizing the
     table to its content instead leaves every column snug and all the slack out
     at the pane's edge, so a pane is two thirds empty with the reading crammed
     into the first third. Capping the track cannot help either: the amount of
     content is fixed, so the only question is where the emptiness goes.
     
     minmax(max-content, 1fr) answers it: max-content is each column's own
     minimum, and the fr splits what remains evenly, so every column is a little
     wider than it needs and none is stretched to swallow the rest. Grid rather
     than table layout because no table algorithm distributes surplus equally —
     they all weight it by content.
     
     --cols has to be declared per table, hence the cols-N classes: a grid needs
     its column count up front where a table infers it from the markup. */
  .pane table.packed {
    display: grid;
    grid-template-columns: repeat(var(--cols, 4), max-content);
    align-items: start;
    /* A table wider than its pane scrolls inside itself rather than pushing the
       page sideways. max-content minimums make that possible on a narrow
       window, where a table would instead have wrapped its cells. */
    max-width: 100%; overflow-x: auto;
  }
  /* Spreading is opt-in, per table, and the threshold is the pane rather than
     the table.
     
     Machines, hosts, nodes, pods and node pools all sit in a half-width pane and
     all read better spread: at content width they used a third of it. A storage
     cluster's hosts sit in a full-width pane, and spreading four short columns
     across two thousand pixels put four hundred and eighty pixels between a host
     and its role.
     
     So it is not how many columns a table has — node pools has four short ones
     and spreads fine at a half — it is how much wider than its content the pane
     is. Past roughly three times, the columns stop reading as one row. Judged
     per table because CSS cannot express it: minmax() takes a cap, not a
     ratio. */
  .pane table.packed.spread { grid-template-columns: repeat(var(--cols, 4), minmax(max-content, 1fr)); }
  /* A spread table left-aligns even its numeric columns.
     
     Right alignment puts a cell's content at the far edge of its track, and a
     spread track is much wider than its content — so a right-aligned READY sat
     three hundred pixels from the pod name before it and hard against the
     STATUS after it. The columns clumped into pairs with gaps between them,
     which is what "a lot of space between columns" was describing. Left-aligned,
     every column starts at its own track and the gaps are equal, which is what
     dividing the surplus evenly was supposed to look like.
     
     The .r class keeps its other job: tabular-nums, so digits still line up
     under each other down the column. */
  .pane table.packed.spread td.r, .pane table.packed.spread th.r { text-align: left; }
  /* The row structure lives in the column count now, so the table's own
     grouping elements step out of the way and let the cells be grid items. */
  .pane table.packed thead, .pane table.packed tbody, .pane table.packed tr { display: contents; }
  /* colspan has no meaning in a grid; a cell that spanned the row says so. */
  .pane table.packed .full { grid-column: 1 / -1; }
  .cols-3 { --cols: 3; }
  .cols-4 { --cols: 4; }
  .cols-5 { --cols: 5; }
  .cols-6 { --cols: 6; }
  .cols-7 { --cols: 7; }
  /* A gutter is still wanted as the minimum: the fr share is what a wide pane
     adds, and on a cramped one the columns would otherwise touch. */
  .pane table.packed td:not(:last-child), .pane table.packed th:not(:last-child),
  .panes.inner table td:not(:last-child), .panes.inner table th:not(:last-child) {
    padding-right: 1.1rem;
  }
  /* The storage layer is a peer of the cluster grid, not a card in it: it
     belongs to the datacenter, and putting it inside the grid would have it
     sorted among clusters it is not one of.
     
     Its contents are .pane, deliberately. Every table rule in this sheet is
     scoped to .pane, so the first version of this panel — a .card holding a
     table — inherited none of them and rendered at the browser's defaults:
     centered bold headers at 1rem beside the app's own .78rem. A new region
     that shows tables either lives inside .pane or restates the whole
     stylesheet. */
  .storage { margin-top: 1.5rem; }
  .storage > h2 {
    margin: 0 0 .7rem; font-size: .95rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: .08em; color: var(--brass);
  }
  /* The status accent the cluster cards use, on a pane. Left border rather than
     a filled background: it has to read at a glance from across a room in wall
     mode without turning the panel into a warning. */
  .storage-pane { border-left: 3px solid var(--loading); }
  .storage-pane.ok      { border-left-color: var(--ok); }
  .storage-pane.warn    { border-left-color: var(--warn); }
  /* Hardware whose Ceph nobody reports. Grey rather than green: the panel does
     not know, and not knowing is not health. */
  .storage-pane.unknown { border-left-color: var(--loading); }
  .storage-pane h3 { text-transform: none; letter-spacing: 0; font-size: .9rem; color: var(--ink); }
  .reporters { margin: 0 0 .5rem; font-size: .78rem; color: var(--dim); }
  /* Ceph's checks are two columns of prose, and prose needs more air between
     columns than a table of numbers does: at the shared gutter a check name sat
     fourteen pixels from the sentence explaining it. */
  /* Ceph's checks are two columns of prose, and the message is the unbounded
     one: given the column's slack it wraps beside its check name instead of
     both crowding into the left third. The other tables in an inner section
     size to their content; this one is the exception, because its content has
     no natural width. */
  .panes.inner table.checks { width: 100%; margin-top: .7rem; }
  .checks td { padding: .22rem 1.6rem .22rem 0; vertical-align: baseline; }
  .checks td:last-child { padding-right: 0; }
  .ceph-health { margin: 0 0 .5rem; font-size: .82rem; font-variant-numeric: tabular-nums; }
  .reporters a { color: var(--teal); text-decoration: none; }
  .reporters a:hover { text-decoration: underline; }
  /* An fsid is the identity but not the name, so it reads as a serial number
     rather than as a heading. */
  .fsid { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; color: var(--teal); font-size: .85rem; }
  /* .footnote itself is defined below, with the other pane text. */
  .footnote code { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: .95em; }

  /* A state and its count are one token to a reader, so they must not be split
     by a line break. Inline-block rather than nowrap on the cell: the list as a
     whole still needs to wrap when there are more states than fit. */
  .state { display: inline-block; white-space: nowrap; }
  /* A long value that is not the last column wraps rather than grows. A growth
     column in the middle of a row pushes every column after it to the far edge,
     which is the same mistake .msg exists to avoid making everywhere else. */
  .wrap { word-break: break-word; }
  /* An identifier is one token and reads as one. Given a floor it stops
     wrapping a replica set name onto three lines while the message column beside
     it keeps the slack. */
  .ident { min-width: 15rem; }
  /* An age is two short tokens and reads as one; letting "1m ago" wrap costs a
     second line on every row of the longest table on the page. */
  .nowrap { white-space: nowrap; }
  /* How many objects reported one grouped event. Dimmer than the kind it
     follows, because the kind is the identity and this is the arithmetic. */
  .tally { color: var(--dim); font-variant-numeric: tabular-nums; }
  /* An aside about what a pane is not showing. Quieter than the pane's own
     content, because it is a boundary rather than a finding. */
  .footnote { font-size: .73rem; margin: .7rem 0 0; }
  /* The quiet half of a big table. A production undercloud's healthy nodes and
     the datacenter's other hosts are real answers to questions nobody is asking
     yet, so they stay one click away rather than off the page: <details> does
     that with no script, and prints expanded. */
  .quiet { margin-top: .55rem; }
  .quiet > summary {
    cursor: pointer; color: var(--teal); font-size: .75rem;
    padding: .15rem 0; width: fit-content;
  }
  .quiet > summary:hover { text-decoration: underline; }
  .quiet > table { margin-top: .4rem; }
  @media print { .quiet > table { display: table; } }

  .summary {
    margin: 0; font-size: .76rem; color: var(--ink);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
  }
  /* Network and Cloud hold several subsystems each. Nesting a grid inside the
     pane lets Cilium, OVN and MetalLB sit side by side on a wide screen and
     stack on a narrow one, without any of them needing a fixed height. */
  /* Inner columns share the pane. Capping them at 30rem instead left a
     full-width network pane using two thirds of its own width, which is a
     different waste from the one the cap was fixing: the thousand pixels
     between a MetalLB pool's address range and its addresses-in-use count came
     from the *table* stretching to fill its column, not from the column being
     wide. Tables here size to their content (see below), so a wide track now
     leaves its slack at the column's edge, where it does no harm. */
  .panes.inner {
    display: grid; columns: auto;
    /* 24rem, not 19: a pane is half the page now, and at the lower floor
       auto-fit packed three sections into room for two — OVN's five-column
       table does not fit in a third of a half. */
    gap: 1.25rem; margin-top: .2rem; grid-template-columns: repeat(auto-fit, minmax(24rem, 1fr));
  }
  /* A sub-table sizes to its content, like .packed and for the same reason. The
     exception stays the exception: a genuinely unbounded last column still
     takes the slack, which is what .msg is for. */
  .panes.inner table { width: auto; max-width: 100%; }
  .sub { min-width: 0; }
  .sub h4 {
    margin: 0 0 .35rem; font-size: .68rem; letter-spacing: .08em;
    text-transform: uppercase; color: var(--teal); font-weight: 700;
  }
  .pane > h4 {
    margin: 1rem 0 .35rem; font-size: .68rem; letter-spacing: .08em;
    text-transform: uppercase; color: var(--teal); font-weight: 700;
  }
  .okish { color: var(--ok); }
  .backlink { color: var(--teal); text-decoration: none; font-size: .8rem; }
  .backlink:hover { text-decoration: underline; }
  .card-link { color: inherit; text-decoration: none; }
  .card-link:hover h2 { text-decoration: underline; text-decoration-color: var(--brass); }
</style>
