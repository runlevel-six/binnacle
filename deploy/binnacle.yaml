---
apiVersion: v1
kind: Namespace
metadata:
  name: binnacle
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: binnacle
  namespace: binnacle
  labels: {app.kubernetes.io/name: binnacle}
spec:
  # One replica.
  #
  # Binnacle holds no state worth replicating: it re-reads the fleet from the
  # management cluster on startup and every reconcile. Two replicas would
  # double the watch load on that cluster and split browser sessions across
  # pods, which the signed session cookie survives only if BINNACLE_SESSION_KEY
  # is set to the same value in both.
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: binnacle}
  template:
    metadata:
      labels: {app.kubernetes.io/name: binnacle}
    spec:
      serviceAccountName: binnacle
      securityContext:
        runAsNonRoot: true
        # Explicit UID as well as runAsNonRoot: the image's own USER is a name,
        # and a kubelet enforcing runAsNonRoot cannot resolve one. 65532 is
        # distroless's nonroot.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      volumes:
        # Memory-backed, because binnacle writes each cluster's clouds.yaml here
        # for gophercloud to read and those are credentials. The container's
        # root filesystem is read-only, so this is also the only writable path
        # it has.
        - name: clouds
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        # Your site profile, as a ConfigMap holding one key named for the file:
        #
        #   kubectl -n binnacle create configmap binnacle-profile \
        #     --from-file=my-site.yaml=/path/to/my-site.yaml
        #
        # Only your own profile needs to be here. Whatever it `extends`
        # resolves from the profiles embedded in the binary.
        - name: profile
          configMap: {name: binnacle-profile}
      containers:
        - name: binnacle
          # Published to GHCR by .github/workflows/image.yaml. A registry that
          # proxies GHCR works too — point this at the proxy.
          #
          # A version, not `latest` or `edge`. Both of those move, and this
          # manifest sets no imagePullPolicy — so the default, IfNotPresent,
          # means a node that has already cached the tag will keep running the
          # image it has. The deployment reports Available, `rollout restart`
          # does nothing, and the page serves an old build with nothing
          # anywhere saying so. Pinning is what makes the version on the
          # cluster the version in this file.
          #
          # Better still, pin the digest alongside the tag —
          # `binnacle:1.9.0@sha256:...` — which is immutable even if a tag is
          # moved or rebuilt. `docker buildx imagetools inspect` or a registry
          # HEAD on the manifest will give you one.
          #
          # Keep this in step with the flags below. An image older than a flag
          # it is passed does not degrade gracefully: an unrecognized flag is a
          # parse error and the container exits, so the mismatch is a
          # CrashLoopBackOff rather than a missing feature.
          image: ghcr.io/runlevel-six/binnacle:1.9.0
          args:
            - --addr=:8080
            # Names this instance in the header and browser title. Sites reuse
            # workload cluster names, so without it two deployments render
            # pages identical down to the names on the cards.
            - --site=site-a
            # Where the Cluster objects live. Must match the namespace the
            # Role in rbac.yaml is created in.
            - --namespace=managed-clusters
            # What operators call this management cluster. Optional: without it
            # the management panel reads "Management cluster", which is
            # accurate and is not what anybody calls it.
            - --management-name=mgmt-01
            # A path, not a name: a bare name is searched for in
            # ~/.config/sextant/profiles and ./profiles, and a container has
            # neither. This is the file mounted from the ConfigMap below.
            # The profile is read once at startup, so editing the ConfigMap
            # needs a `kubectl rollout restart` to take effect.
            - --profile=/etc/binnacle/profiles/my-site.yaml
            # Per-cluster OpenStack credentials are written here for
            # gophercloud, which reads a file and nothing else.
            - --clouds-dir=/run/binnacle/clouds
            # Naming an issuer is what turns authentication on. Without one
            # binnacle refuses to serve anything but loopback, unless you pass
            # --allow-unauthenticated and accept what that means.
            - --oidc-issuer=https://sso.example/realms/platform
            - --oidc-client-id=binnacle
            - --oidc-redirect-url=https://binnacle.site-a.example/auth/callback
            # Optional, and only for `sextant --server`. A terminal cannot hold
            # the client secret the browser uses, so it authenticates as a
            # separate *public* client, and a public client stamps its own
            # audience on the token. Naming it here is what makes that audience
            # acceptable; leaving it out accepts only --oidc-client-id, which is
            # right for a deployment with one client. Clients see whichever
            # applies at /api/v1/authinfo.
            - --oidc-cli-client-id=binnacle-cli
            # Scopes the terminal client requests. Adding offline_access lets a
            # `sextant --server` session survive being closed for hours, which
            # the default scopes do not: an ordinary refresh token dies with the
            # provider's SSO session. Bound it at the provider *and* leave
            # sextant's own max_session ceiling in place — an offline token
            # defaults to 30 days in a stock Keycloak. Not set by default.
            # - --oidc-cli-scopes=openid,profile,email,offline_access
          env:
            # Neither of these is a flag: a command line is visible in the
            # process table.
            - name: BINNACLE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: binnacle-oidc, key: client-secret}
            # Set this explicitly. A generated key does not survive a restart,
            # and sign-in then loops for anyone whose session predates it.
            - name: BINNACLE_SESSION_KEY
              valueFrom:
                secretKeyRef: {name: binnacle-oidc, key: session-key}
          volumeMounts:
            - {name: clouds, mountPath: /run/binnacle/clouds}
            - {name: profile, mountPath: /etc/binnacle/profiles, readOnly: true}
          ports:
            - {name: http, containerPort: 8080}
          # Liveness only. There is deliberately no readiness gate on the
          # fleet being readable: a management cluster that is briefly
          # unreachable should show binnacle saying so, not take binnacle out
          # of service and leave the reader with a 503 that explains nothing.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            # Informers hold every watched object in memory. Two clusters is
            # small; a fleet of twenty warrants raising this and watching it.
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: binnacle
  namespace: binnacle
spec:
  selector: {app.kubernetes.io/name: binnacle}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: binnacle
  namespace: binnacle
  annotations:
    # Server-Sent Events: the fleet stream is deliberately long-lived and must
    # not be cut by a proxy read timeout. Binnacle sends a keepalive every 25s,
    # so any value comfortably above that works; the failure this avoids is a
    # page that looks live and silently stops updating.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: binnacle.site-a.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: binnacle
                port: {name: http}
  tls:
    - hosts: [binnacle.site-a.example]
      secretName: binnacle-tls
