---
# Workload-cluster RBAC for binnacle's collector.
#
# Unlike rbac.yaml (which lives on the management cluster), this manifest is
# applied to each workload cluster binnacle reads. It defines a ServiceAccount
# with two things:
#
#   1. Read on the resources every plugin needs (pods, daemonsets, statefulsets,
#      nodes, events).
#   2. pods/exec scoped to the namespaces where Ceph, Cilium, and OVN pods run —
#      nothing wider.
#
# The kubeconfig for this ServiceAccount is stored in a Secret named
# <cluster>-exec-kubeconfig on the management cluster, in the same namespace as
# the Cluster object. Binnacle resolves it automatically.
#
# **When that Secret is absent, exec falls back to the CAPI-minted kubeconfig,
# which is cluster-admin.** That is the historical behavior and it is a
# fail-open: a manifest applied to the wrong cluster, a typo in the Secret name,
# or a cluster added later and missed leaves the collector with far more
# privilege than this file grants, and nothing says so. The narrowing is only
# real once the Secret exists for every cluster in the fleet — so check, rather
# than assuming that applying this changed anything:
#
#     kubectl get secrets -n <cluster-namespace> | grep exec-kubeconfig
#
# There should be one per cluster.
#
# Human operators get a read-only role with no pods/exec. Under that role,
# sextant sits at TierInformer for Ceph, Cilium, and OVN by design. The tier
# reason says so and names --server as the fix: an operator who needs full-tier
# detail connects to the binnacle server, whose collector holds the scoped exec
# privilege this manifest grants.
#
# **Apply this to each workload cluster**, not the management cluster. The
# namespace placeholders below must match where your Ceph, Cilium, and OVN pods
# actually run.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: binnacle-collector
  namespace: binnacle
---
apiVersion: v1
kind: Namespace
metadata:
  name: binnacle
---
# Read permissions: what every plugin needs to list and watch.
#
# This is a ClusterRole because the plugins read across namespaces — Cilium
# agents run in kube-system, Ceph tools in rook-ceph, OVN databases in their
# own namespace. A namespaced Role would need one per namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: binnacle-collector-read
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "statefulsets", "deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: binnacle-collector-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: binnacle-collector-read
subjects:
  - kind: ServiceAccount
    name: binnacle-collector
    namespace: binnacle
---
# Exec permissions: pods/exec scoped to the namespaces where status commands
# run. Each Role is namespaced — the grant is only valid inside that namespace.
#
# The commands the plugins run are fixed argument lists (ceph -s, cilium status,
# ovn-appctl cluster/status), never assembled from user input. **RBAC does not
# know that.** A create on pods/exec in a namespace permits any command in any
# pod there, so what is granted below is a shell in these namespaces, and the
# fixed command set is a property of this codebase rather than a rule the API
# server enforces. Grant it where you would grant that, and nowhere else. If you
# need the guarantee rather than the convention, a ValidatingAdmissionPolicy on
# the exec subresource can inspect PodExecOptions.command; that is the mechanism
# that actually constrains it.
#
# **Find the namespaces rather than assuming them.** Each plugin discovers where
# its subsystem lives — MetalLB from its IPAddressPools, OVN from its database
# StatefulSets, Ceph from the Rook tools Deployment — precisely because these
# are not always where convention says. The namespaces below are only examples,
# and one of them was wrong for a year: OVN is written here as `openstack`
# because that is where the OpenStack charts put it, but an ovn-kubernetes
# install puts it somewhere else entirely.
#
# Run sextant against the cluster and read the tier reason off each subsystem
# pane — a denied exec names the namespace it tried:
#
#     no pods/exec permission on <namespace>
#
# That is the namespace to write here. A subsystem not present is simply not
# listed: its Role is not created, and the plugin sits at TierInformer for it.

# --- Ceph ---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: binnacle-collector-exec
  namespace: rook-ceph
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: binnacle-collector-exec
  namespace: rook-ceph
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: binnacle-collector-exec
subjects:
  - kind: ServiceAccount
    name: binnacle-collector
    namespace: binnacle
---
# --- Cilium ---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: binnacle-collector-exec
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: binnacle-collector-exec
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: binnacle-collector-exec
subjects:
  - kind: ServiceAccount
    name: binnacle-collector
    namespace: binnacle
---
# --- OVN ---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: binnacle-collector-exec
  namespace: openstack
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: binnacle-collector-exec
  namespace: openstack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: binnacle-collector-exec
subjects:
  - kind: ServiceAccount
    name: binnacle-collector
    namespace: binnacle
